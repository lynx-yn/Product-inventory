<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Inventory CRUD</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
        crossorigin="anonymous">
</head>

<body>

    <div class="container my-5">

        <h1 class="text-center text-primary">
            PRODUCT INVENTORY CRUD
        </h1>

        <!-- edit status -->
        <input id="editstatus" type="text" hidden>

        <form id="userForm">

            <div class="row my-5">

                <div class="col-lg-3">
                    <input id="proid"
                        type="number"
                        placeholder="Product Id"
                        class="form-control"
                        required>
                </div>

                <div class="col-lg-3">
                    <input id="proname"
                        type="text"
                        placeholder="Product Name"
                        class="form-control"
                        required>
                </div>

                <div class="col-lg-3">

                    <select name="category"
                        id="category"
                        class="form-select"
                        required>

                        <option value="" selected disabled>
                            Select Category
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="clothing">
                            Clothing
                        </option>

                        <option value="groceries">
                            Groceries
                        </option>

                    </select>

                </div>

                <div class="col-lg-3">

                    <input id="price"
                        type="number"
                        placeholder="Price"
                        class="form-control"
                        required>

                </div>

            </div>


            <div class="row my-5">

                <div class="col-lg-3">

                    <input id="quantity"
                        type="number"
                        placeholder="Quantity"
                        class="form-control"
                        required>

                </div>

                <div class="col-lg-3">

                    <button type="submit"
                        class="btn btn-success w-100">
                        Add Product
                    </button>

                </div>

            </div>


            <!-- SEARCH AND FILTER -->

            <div class="row">

                <div class="col-lg-6">

                    <input id="search"
                        type="search"
                        placeholder="Search product name"
                        class="form-control">

                </div>

                <div class="col-lg-6">

                    <select name="categoryFilter"
                        id="categoryFilter"
                        class="form-select">

                        <option value="">
                            All Categories
                        </option>

                        <option value="electronics">
                            Electronics
                        </option>

                        <option value="accessories">
                            Accessories
                        </option>

                        <option value="clothing">
                            Clothing
                        </option>

                        <option value="groceries">
                            Groceries
                        </option>

                    </select>

                </div>

            </div>

        </form>


        <!-- PRODUCT TABLE -->

        <table class="my-5 table table-bordered table-hover">

            <thead class="table-dark text-light text-center">

                <tr>

                    <th>#</th>
                    <th>Product ID</th>
                    <th>Product Name</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Quantity</th>
                    <th>Action</th>

                </tr>

            </thead>

            <tbody id="tableBody">

            </tbody>

        </table>

    </div>


    <script src="main.js"></script>

</body>

</html>
